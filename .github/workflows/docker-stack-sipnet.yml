name : Docker Stack Model Test
on :
  pull_request:

  # allow manual triggering
  workflow_dispatch:

  schedule:
    # run Thursday 4:30 AM UTC
  - cron: '30 4 * * 4'    
jobs:
  sipnet:
    runs-on: ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:

    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up Docker Compose
      run: |
          sudo apt-get update
          sudo apt-get -y install docker-compose
          
    - name: Add Volumes to Executor
      run: |
          cp docker-compose.dev.yml docker-compose.override.yml
          sed -i'' '/R_library/d' docker-compose.override.yml

    - name: Build Containers
      run: |
        cp docker/env.example .env
        echo "COMPOSE_PROJECT_NAME=pecan" >> .env
        echo "PECAN_VERSION=develop" >> .env
        echo "UID=$(id -u)" >> .env
        echo "GID=$(id -g)" >> .env
        
        # Start postgres and wait for it to be ready
        docker compose up -d postgres
        echo "Waiting for postgres to be ready..."
        sleep 30  # Give postgres time to initialize
        
        # Initialize database
        docker pull pecan/db
        docker run --rm --network pecan_pecan pecan/db
        
        # Create required BETY users
        docker compose run --rm bety user guestuser guestuser "Guest User" guestuser@example.com 4 4
        docker compose run --rm bety user carya illinois "Carya Demo User" carya@example.com 1 1
        
        # Load example data
        docker pull pecan/data:develop
        docker run -ti --rm --network pecan_pecan --volume pecan_pecan:/data --env FQDN=docker pecan/data:develop
        docker run --rm --network pecan_pecan --volume pecan_pecan:/data pecan/data:develop chown -R "$(id -u):$(id -g)" /data
        docker run --user="$(id -u)" --rm --network pecan_pecan --volume pecan_pecan:/data --env FQDN=docker pecan/data:develop        
        docker image rm pecan/db pecan/data:develop
    
    - name: Run required containers
      run: |
        docker compose up --wait -d sipnet executor monitor rabbitmq

    - name: List running containers
      run: |
        sleep 50
        docker ps

    - name: Run SIPNET
      run: |
        docker compose exec --workdir /pecan/tests executor R CMD ../web/workflow.R --settings docker-ghaction.sipnet.xml
