name: Render Demo Notebooks

on:
  push:
    branches:
      - main
      - develop
    tags:
      - '*'
  pull_request:
  merge_group:
  workflow_dispatch:

jobs:
  # Detect which packages changed
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.detect.outputs.changed_packages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for proper diff

      - name: Detect changed packages
        id: detect
        run: |
          # Determine base commit for comparison
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" == "push" ]; then
            BASE_SHA="${{ github.event.before }}"
          else
            # For workflow_dispatch or other events, compare with HEAD~1
            BASE_SHA="HEAD~1"
          fi
          
          echo "Comparing against: $BASE_SHA"
          
          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD || echo "")
          
          echo "Changed files:"
          echo "$CHANGED_FILES"
          
          # Determine which packages need reinstallation
          CHANGED_PKGS=""
          for pkg_dir in base/* modules/*; do
            if [ -d "$pkg_dir" ]; then
              if echo "$CHANGED_FILES" | grep -q "^$pkg_dir/"; then
                CHANGED_PKGS="$CHANGED_PKGS $pkg_dir"
              fi
            fi
          done
          
          if [ -z "$CHANGED_PKGS" ]; then
            echo "changed_packages=none" >> $GITHUB_OUTPUT
            echo "No package changes detected"
          else
            echo "changed_packages=$CHANGED_PKGS" >> $GITHUB_OUTPUT
            echo "Changed packages: $CHANGED_PKGS"
          fi

  # Run styler check
  check-style:
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull and prepare Docker image
        run: |
          docker pull pecan/base:latest
          docker tag pecan/base:latest pecan-base-ci:latest

      - name: Reinstall changed packages
        if: needs.detect-changes.outputs.changed_packages != 'none'
        run: |
          CHANGED_PKGS="${{ needs.detect-changes.outputs.changed_packages }}"
          docker run --rm -v ${{ github.workspace }}:/work -w /work pecan-base-ci:latest bash -c "
            set -e
            for pkg in $CHANGED_PKGS; do
              echo \"Reinstalling: \$pkg\"
              cd \$pkg && R CMD INSTALL . && cd /work
            done
          "

      - name: Check R code style with styler
        run: |
          docker run --rm -v ${{ github.workspace }}:/work pecan-base-ci:latest Rscript -e '
            library(styler)
            files_to_check <- c(
              "/work/documentation/tutorials/Demo_1_Basic_Run/run_pecan.qmd",
              "/work/documentation/tutorials/Demo_02_Uncertainty_Analysis/uncertainty.qmd"
            )
            unstyled <- style_file(files_to_check)
            if (is.data.frame(unstyled) && "changed" %in% names(unstyled) && any(unstyled$changed == TRUE)) {
              print(unstyled[unstyled$changed, ])
              stop("One or more .qmd files are not styled. Please run styler::style_file() locally and commit the changes.")
            } else {
              cat("All checked .qmd files are styled.\n")
            }
          '

  # Render notebooks in parallel
  render-notebooks:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        notebook:
          - name: "Demo_1_Basic_Run"
            path: "documentation/tutorials/Demo_1_Basic_Run/run_pecan.qmd"
            dir: "documentation/tutorials/Demo_1_Basic_Run"
          - name: "Demo_02_Uncertainty_Analysis"
            path: "documentation/tutorials/Demo_02_Uncertainty_Analysis/uncertainty.qmd"
            dir: "documentation/tutorials/Demo_02_Uncertainty_Analysis"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.17'

      - name: Pull and prepare Docker image
        run: |
          docker pull pecan/base:latest
          docker tag pecan/base:latest pecan-base-ci:latest

      - name: Reinstall changed packages
        if: needs.detect-changes.outputs.changed_packages != 'none'
        run: |
          CHANGED_PKGS="${{ needs.detect-changes.outputs.changed_packages }}"
          docker run --rm -v ${{ github.workspace }}:/work -w /work pecan-base-ci:latest bash -c "
            set -e
            for pkg in $CHANGED_PKGS; do
              echo \"Reinstalling: \$pkg\"
              cd \$pkg && R CMD INSTALL . && cd /work
            done
          "

      - name: Render ${{ matrix.notebook.name }}
        run: |
          docker run --rm -v ${{ github.workspace }}:/work pecan-base-ci:latest bash -c "
            quarto render /work/${{ matrix.notebook.path }} --to html
          "

      - name: Upload rendered notebook
        uses: actions/upload-artifact@v4
        with:
          name: notebook-${{ matrix.notebook.name }}
          path: |
            ${{ matrix.notebook.dir }}/*.html
            ${{ matrix.notebook.dir }}/*_files/
          retention-days: 5

  # Combine and deploy
  deploy:
    needs: [check-style, render-notebooks]
    runs-on: ubuntu-latest
    if: always() && needs.check-style.result == 'success' && needs.render-notebooks.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all notebook artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: notebook-*
          path: notebooks/
          merge-multiple: false

      - name: Combine all rendered notebooks
        run: |
          mkdir -p quarto_html_build
          find notebooks/ -type f -name "*.html" -exec cp {} quarto_html_build/ \;
          find notebooks/ -type d -name "*_files" -exec cp -r {} quarto_html_build/ \;

      - name: Upload combined HTML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quarto-html
          path: quarto_html_build/
          retention-days: 5

      - name: Check if documentation repo exists
        id: doc_exists
        run: |
          if git ls-remote https://github.com/${{ github.repository_owner }}/pecan-documentation.git > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout documentation repo
        if: ${{ github.event_name == 'push' && steps.doc_exists.outputs.exists == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/pecan-documentation
          path: pecan-documentation
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Deploy HTML to documentation repo
        if: ${{ github.event_name == 'push' && steps.doc_exists.outputs.exists == 'true' }}
        run: |
          git config --global user.email "pecanproj@gmail.com"
          git config --global user.name "GitHub Documentation Robot"
          
          export VERSION=$(echo $GITHUB_REF | sed 's,.*/,,' )
          if [ "$VERSION" = "main" ]; then
            export VERSION=latest
          fi
          
          TARGET_DIR="pecan-documentation/${VERSION}/rendered-demo-notebooks"
          mkdir -p $TARGET_DIR
          
          rsync -a --delete quarto_html_build/* $TARGET_DIR/
          echo "Autogenerated by https://github.com/PecanProject/pecan/actions/workflows/render-quarto.yml" > "$TARGET_DIR"/README.txt
          
          cd pecan-documentation
          git add --all *
          git commit -m "Update Quarto HTML from pecan revision ${GITHUB_SHA}" || true
          git push -q origin main
