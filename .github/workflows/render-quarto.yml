name: Render Quarto PDF

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    container:
      image: pecan/base:develop-R4.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.8.17'

      - name: Install TinyTeX
        run: |
          quarto install tinytex

      - name: Render the Quarto notebook to PDF
        run: |
          quarto render documentation/tutorials/Demo_1_Basic_Run/run_pecan.qmd --to pdf
